<!DOCTYPE html>
<html lang="uz">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GOLD TAP</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    .bottom-nav {
      position: fixed;
      bottom: 10px;
      left: 10px;
      right: 10px;
      z-index: 999;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 7px 3px;
      background: rgba(25, 20, 10, 0.96);
      border: 1px solid #c9a448;
      border-radius: 18px;
      box-shadow: 0 0 12px #8b691f;
    }

    .bottom-nav button {
      background: transparent;
      border: none;
      color: #e9cf83;
      font-size: 19px;
      padding: 4px 2px;
    }

    .bottom-nav button span {
      display: block;
      font-size: 10px;
      margin-top: 3px;
    }


    body {
      padding-bottom: 100px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #49340c, #17130a 45%, #090909);
      color: #fff6da;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 25px 15px;
    }

    h1 {
      color: #ffd65c;
      font-size: 42px;
      letter-spacing: 6px;
      text-shadow: 0 0 15px #ffbd24, 0 0 30px #bd8110;
      margin: 15px 0 5px;
    }

    .subtitle {
      color: #c9b56a;
      letter-spacing: 4px;
      font-size: 12px;
      margin-bottom: 45px;
    }

    .panel {
      width: 100%;
      max-width: 500px;
      margin: auto;
      padding: 30px 20px;
      border: 1px solid #a77c19;
      border-radius: 25px;
      background: rgba(20, 17, 9, 0.85);
    }

    .label {
      color: #cbb879;
      font-size: 18px;
    }

    #score {
      font-size: 75px;
      font-weight: bold;
      margin: 25px 0;
      color: #fff0a8;
      text-shadow: 0 0 20px #ffcc42;
    }

    .coin {
      width: 250px;
      height: 250px;
      max-width: 75vw;
      max-height: 75vw;
      border-radius: 50%;
      border: 8px solid #ffe88c;
      background: radial-gradient(circle at 30% 25%, #fff5a0, #ffc42e 50%, #a96b08);
      color: #623800;
      font-size: 38px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 25px #ffca36, 0 0 55px #b47b12;
      margin: 0 auto 35px;
      display: block;
      transition: transform 0.08s;
      appearance: none;
      -webkit-appearance: none;
      -webkit-tap-highlight-color: transparent;
      outline: none;
      background-color: transparent;
    }

    .coin:active {
      transform: scale(0.94);
    }

    .energy {
      font-size: 22px;
      margin: 10px 0;
      color: #ffdb70;
    }

    .bar {
      width: 100%;
      height: 14px;
      background: #493716;
      border-radius: 20px;
      overflow: hidden;
      margin: 15px 0 25px;
    }

    .fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #d18a08, #ffe27c);
      transition: width 0.3s;
    }

    .action {
      width: 100%;
      padding: 22px 10px;
      margin: 8px 0;
      border: 1px solid #c69a30;
      border-radius: 20px;
      background: rgba(72, 49, 9, 0.45);
      color: #ffe6a0;
      font-size: 21px;
      font-weight: bold;
      cursor: pointer;
    }

    .action:active {
      background: #68450d;
    }

    #bonusTimer {
      color: #ffe6a0;
      font-size: 20px;
      margin: 3px 0 18px;
      font-variant-numeric: tabular-nums;
    }

    .message {
      min-height: 30px;
      margin: 15px 0;
      color: #ffdf70;
      font-size: 16px;
    }

    .footer {
      margin-top: 25px;
      color: #a99560;
      font-size: 13px;
      letter-spacing: 2px;
    }

    .footer {
      margin-top: 25px;
      color: #a99560;
      font-size: 13px;
      letter-spacing: 2px;
    }

    .footer {
      margin-top: 25px;
      color: #a99560;
      font-size: 13px;
      letter-spacing: 2px;
    }

    .coin {
      position: relative;
      overflow: visible;
    }

    .tap-float {
      position: absolute;
      top: 20%;
      left: 50%;
      transform: translateX(-50%);
      color: #ffe66d;
      font-size: 28px;
      font-weight: bold;
      white-space: nowrap;
      pointer-events: none;
      z-index: 100;
      text-shadow: 0 0 15px gold;
      animation: goldFloat 0.8s ease-out forwards;
    }

    @keyframes goldFloat {
      from {
        opacity: 1;
        margin-top: 0;
      }

      to {
        opacity: 0;
        margin-top: -100px;
      }
    }
  </style>
</head>

<body>

  <h1>GOLD TAP 👑</h1>
  <div class="subtitle">TAP • COLLECT • RISE</div>

  <div class="panel">
    <div id="tab-home" class="tab-content>
    <div class=" label">YOUR GOLD BALANCE</div>

    <div id="score">0</div>

    <button class="coin" onclick="tapCoin()">
      GOLD<br>TAP
    </button>

    <div class="energy">
      ⚡ ENERGY:
      <span id="energy">100</span> / 100
    </div>

    <div class="bar">
      <div class="fill" id="energyBar"></div>
    </div>
  </div>
  <div id="tab-bonus" class="tab-content">

    <button class="action" onclick="dailyBonus()">
      🎁 DAILY BONUS +100 GOLD
    </button>

    <div id="bonusTimer">
      Бонус таймери: --:--:--
    </div>

  </div>
  <button class="action" onclick="inviteFriends()">
    👥 INVITE FRIENDS
  </button>
  <div class="tasks">
    <h2>🎯 TASKS</h2>

    <button class="action" id="task1" onclick="claimTask(1, 2)">
      📢 1-CHANNEL — +2 GOLD / TAP
    </button>

    <button class="action" id="task2" onclick="claimTask(2, 3)">
      📢 2-CHANNEL — +3 GOLD / TAP
    </button>

    <button class="action" id="task3" onclick="claimTask(3, 5)">
      📢 3-CHANNEL — +5 GOLD / TAP
    </button>

    <div id="tapLevel">CURRENT TAP: 1 GOLD</div>
  </div>
  <div class="message" id="message"></div>

  <div class="footer">
    GOLD TAP - YOUR GOLD ADVENTURE
  </div>

  </div>

  <script>

    // ==========================
    // GOLD TAP SETTINGS
    // ==========================

    const MAX_ENERGY = 100;
    const ENERGY_INTERVAL = 3000;
    const BONUS_INTERVAL = 86400000;

    let score = Number(localStorage.getItem("goldScore")) || 0;

    let energy = Number(
      localStorage.getItem("goldEnergy") ?? 100
    );

    energy = Math.max(0, Math.min(MAX_ENERGY, energy));

    const tg = window.Telegram?.WebApp;

    if (tg) {
      tg.ready();
      tg.expand();
    }

    // ==========================
    // ENERGY TIME
    // ==========================

    let lastEnergyTime =
      Number(localStorage.getItem("goldEnergyTime")) || Date.now();

    if (energy >= MAX_ENERGY) {
      lastEnergyTime = Date.now();
    }

    localStorage.setItem("goldEnergyTime", lastEnergyTime);

    // ==========================
    // SAVE DATA
    // ==========================

    function saveGame() {
      localStorage.setItem("goldScore", score);
      localStorage.setItem("goldEnergy", energy);
      localStorage.setItem("goldEnergyTime", lastEnergyTime);
    }

    // ==========================
    // UPDATE SCREEN
    // ==========================

    function updateScreen() {

      document.getElementById("score").textContent = score;

      document.getElementById("energy").textContent = energy;

      document.getElementById("energyBar").style.width =
        energy + "%";
    }

    // ==========================
    // TAP COIN
    // ==========================

    let tapMultiplier = Number(
      localStorage.getItem("tapMultiplier")
    ) || 1;

    function tapCoin() {
      recoverEnergy();

      if (energy <= 0) {
        document.getElementById("message").textContent =
          "Энергия тугади!";
        return;
      }

      score += tapMultiplier;
      energy--;

      localStorage.setItem("goldScore", score);
      localStorage.setItem("goldEnergy", energy);
      document.getElementById("message").textContent =
        "+" + tapMultiplier + " GOLD! 🪙";
      showTapFloat();
      updateScreen();
      function showTapFloat() {
        const coin = document.querySelector(".coin");

        const popup = document.createElement("span");

        popup.className = "tap-float";
        popup.textContent = "+" + tapMultiplier + " GOLD";

        coin.appendChild(popup);

        setTimeout(() => {
          popup.remove();
        }, 800);
      }
    }
    // ==========================
    // DAILY BONUS
    // ==========================

    function dailyBonus() {

      const now = Date.now();

      const lastBonus =
        Number(localStorage.getItem("lastBonusTime")) || 0;

      if (now - lastBonus < BONUS_INTERVAL) {

        document.getElementById("message").textContent =
          "Бонус вақти ҳали келмади!";

        updateBonusTimer();
        return;
      }

      score += 100;

      localStorage.setItem("goldScore", score);
      localStorage.setItem("lastBonusTime", now);

      document.getElementById("message").textContent =
        "Табриклаймиз! +100 GOLD!";

      updateScreen();
      updateBonusTimer();
    }

    // ==========================
    // BONUS TIMER
    // ==========================

    function updateBonusTimer() {

      const timer = document.getElementById("bonusTimer");

      const lastBonus =
        Number(localStorage.getItem("lastBonusTime")) || 0;

      if (!lastBonus) {
        timer.textContent = "🎁 Бонус олишга тайёр!";
        return;
      }

      const remaining = Math.max(
        0,
        BONUS_INTERVAL - (Date.now() - lastBonus)
      );

      const hours = Math.floor(remaining / 3600000);

      const minutes = Math.floor(
        (remaining % 3600000) / 60000
      );

      const seconds = Math.floor(
        (remaining % 60000) / 1000
      );

      timer.textContent =
        "🎁 " +
        String(hours).padStart(2, "0") + ":" +
        String(minutes).padStart(2, "0") + ":" +
        String(seconds).padStart(2, "0");
    }

    // ==========================
    // INVITE FRIENDS
    // ==========================

    function inviteFriends() {

      const link =
        "https://t.me/goldtap_global_bot?start=invite";

      const shareLink =
        "https://t.me/share/url?url=" +
        encodeURIComponent(link) +
        "&text=" +
        encodeURIComponent("GOLD TAP ўйинига қўшил!");

      if (tg) {
        tg.openTelegramLink(shareLink);
      } else if (navigator.clipboard) {
        navigator.clipboard.writeText(link)
          .then(() => {
            document.getElementById("message").textContent =
              "Таклиф ҳаволаси нусхаланди!";
          })
          .catch(() => {
            document.getElementById("message").textContent = link;
          });
      } else {
        document.getElementById("message").textContent = link;
      }
    }

    // ==========================
    // ONLINE + OFFLINE ENERGY
    // ==========================

    function recoverEnergy() {

      const now = Date.now();

      if (energy >= MAX_ENERGY) {

        energy = MAX_ENERGY;
        lastEnergyTime = now;

        saveGame();
        return;
      }

      const elapsed = Math.floor(
        (now - lastEnergyTime) / ENERGY_INTERVAL
      );

      if (elapsed > 0) {

        energy = Math.min(
          MAX_ENERGY,
          energy + elapsed
        );

        lastEnergyTime += elapsed * ENERGY_INTERVAL;

        if (energy >= MAX_ENERGY) {
          lastEnergyTime = now;
        }

        saveGame();
        updateScreen();
      }
    }

    // ==========================

    recoverEnergy();

    updateScreen();
    updateBonusTimer();

    setInterval(recoverEnergy, 1000);
    setInterval(updateBonusTimer, 1000);

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) {
        recoverEnergy();
        updateBonusTimer();
      }
    });

    window.addEventListener("focus", () => {
      recoverEnergy();
      updateBonusTimer();
    });
    // TAP MULTIPLIER TEST
    function setTapMultiplier(level) {
      tapMultiplier = level;

      localStorage.setItem("tapMultiplier", level);

      document.getElementById("message").textContent =
        "TAP қиймати: " + level + " GOLD";

      updateScreen();
    }

    // ONE-TIME TASK SYSTEM
    let claimedTasks = JSON.parse(
      localStorage.getItem("claimedTasks") || "[]"
    );

    function claimTask(taskId, level) {

      if (claimedTasks.includes(taskId)) {
        document.getElementById("message").textContent =
          "Бу вазифа аввал бажарилган!";
        return;
      }

      claimedTasks.push(taskId);

      localStorage.setItem(
        "claimedTasks",
        JSON.stringify(claimedTasks)
      );

      tapMultiplier = Math.max(tapMultiplier, level);

      localStorage.setItem("tapMultiplier", tapMultiplier);

      document.getElementById("message").textContent =
        "Табриклаймиз! +" + level + " TAP!";

      updateScreen();
      updateTaskButtons();
    }
    function showTab(tab) {
      const home = document.getElementById("tab-home");
      const bonus = document.getElementById("tab-bonus");

      if (home) home.style.display = "none";
      if (bonus) bonus.style.display = "none";

      if (tab === "home" && home) {
        home.style.display = "block";
      }

      if (tab === "bonus" && bonus) {
        bonus.style.display = "block";
      }
    }
    function updateTaskButtons() {
      for (let id = 1; id <= 3; id++) {
        const button = document.getElementById("task" + id);

        if (button && claimedTasks.includes(id)) {
          button.disabled = true;
          button.textContent = "✅ COMPLETED";
        }
      }

      document.getElementById("tapLevel").textContent =
        "CURRENT TAP: " + tapMultiplier + " GOLD";
    }

    updateTaskButtons();</script>
  <nav class="bottom-nav">
    <button onclick="showTab('home')">
      🪙<span>АСОСИЙ</span>
    </button>

    <button onclick="showTab('bonus')">
      🎁<span>БОНУС</span>
    </button>

    <button onclick="showTab('friends')">
      👥<span>ДЎСТЛАР</span>
    </button>

    <button onclick="showTab('history')">
      📜<span>ТАРИХ</span>
    </button>
  </nav>
</body>

</html>
